<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Мобильная проверка · English for Two</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e4e8ed;font:13px system-ui,sans-serif;color:#334354}header{padding:14px;display:flex;justify-content:center;gap:14px;align-items:center;flex-wrap:wrap;background:#fff;border-bottom:1px solid #ccd4dd}nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}a{color:#334354;text-decoration:none;padding:6px 9px;border-radius:6px;background:#edf1f5}main{padding:18px;display:grid;justify-content:center;gap:10px}iframe{display:block;border:1px solid #c9d1db;background:#f5f6f8;border-radius:0}p{margin:0;text-align:center;font-size:11px;color:#657487}</style></head>
<body><header><strong>Проверка вёрстки</strong><nav aria-label="Размер экрана"><a href="?width=320&height=560">320 × 560</a><a href="?width=360&height=640">360 × 640</a><a href="?width=393&height=700">393 × 700</a><a href="?width=430&height=740">430 × 740</a></nav><nav aria-label="Тестовый экран"><a data-view="home" href="?screen=home">Главная</a><a data-view="resume" href="?screen=resume">Продолжение</a><a data-view="story" href="?screen=story">Переписка</a><a data-view="recall" href="?screen=recall">Ввод ответа</a><a data-view="feedback" href="?screen=feedback">Обратная связь</a><a data-view="progress" href="?screen=progress">Словарь</a><a data-view="settings" href="?screen=settings">Настройки</a><a data-view="gifts" href="?screen=gifts">Подарки</a></nav></header>
<main><iframe title="Мобильный экран" id="screen" width="393" height="700" src="./home.html"></iframe><p id="size">393 × 700 · статический макет</p><p>Тестовые данные. Нет входа в аккаунт, запросов к базе или изменений накоплений.</p></main>
<script>const query=new URLSearchParams(location.search),w=Number(query.get('width')),h=Number(query.get('height')),width=[320,360,393,430].includes(w)?w:393,height=[560,640,700,740].includes(h)?h:700,view=['home','resume','story','recall','feedback','progress','settings','gifts'].includes(query.get('screen'))?query.get('screen'):'home';const frame=document.querySelector('#screen');frame.width=width;frame.height=height;frame.src='./'+view+'.html';document.querySelector('#size').textContent=width+' × '+height+' · статический макет';for(const link of document.querySelectorAll('a')){const q=new URLSearchParams(link.search);q.set('width',q.get('width')||width);q.set('height',q.get('height')||height);q.set('screen',q.get('screen')||view);link.href='?'+q;}</script></body></html>
